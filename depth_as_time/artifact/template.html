<style>
/* Layout: a single reading column (~720px) for prose; figures and token grids break out to ~1040px. */
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --fg: #14171c;
  --fg2: #4a515c;
  --muted: #7a818c;
  --rule: #dfe2e7;
  --grid: #eceef1;
  --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --sg: #8b9099;
  --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --q1: #a9c8ef; --q2: #78a7e3; --q3: #4a86d4; --q4: #1f5fae;
  --tok-final-bg: #d9efe4; --tok-final-fg: #0d5a36;
  --tok-marg-bg: #eceef1; --tok-marg-fg: #7a818c;
  --tok-other-bg: transparent; --tok-other-fg: #14171c;
  --display: "IBM Plex Sans Condensed", "IBM Plex Sans KR", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", "IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --panel: #191c21; --fg: #eceef1; --fg2: #b4bac4; --muted: #868d98;
    --rule: #2b3038; --grid: #22262d; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --sg: #8b9099;
    --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --q1: #2a4466; --q2: #34639c; --q3: #4d86d1; --q4: #8db6ee;
    --tok-final-bg: #173b2a; --tok-final-fg: #8fe0b4;
    --tok-marg-bg: #22262d; --tok-marg-fg: #868d98;
    --tok-other-bg: transparent; --tok-other-fg: #eceef1;

}
:root[data-theme="dark"] {
  --bg: #111317; --panel: #191c21; --fg: #eceef1; --fg2: #b4bac4; --muted: #868d98;
  --rule: #2b3038; --grid: #22262d; --accent: #3987e5;

  --q1: #2a4466; --q2: #34639c; --q3: #4d86d1; --q4: #8db6ee;

}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 40px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.prose { max-width: 720px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 26px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.lede { font-size: 18px; color: var(--fg2); }
section { display: grid; gap: 18px; padding-block: 36px; border-top: 1px solid var(--rule); }
header { display: grid; gap: 16px; padding-bottom: 32px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--muted); font-family: var(--mono); }
code, .m { font-family: var(--mono); font-size: 0.9em; }
.findings { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.finding { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; display: grid; gap: 6px; align-content: start; }
.finding .verdict { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
.v-yes { color: var(--s3); } .v-part { color: var(--s4); } .v-no { color: var(--s2); }
.finding p { font-size: 14px; color: var(--fg2); }
.fig { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.figrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.cap { font-size: 13px; color: var(--fg2); }
.cap b { color: var(--fg); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--fg2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
.sw.dash { border-top-style: dashed; } .sw.dot { border-top-style: dotted; }
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.chart .ttl { font-family: var(--body); font-size: 12px; fill: var(--fg); font-weight: 500; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
  padding: 6px 8px; font-size: 12px; font-family: var(--mono); color: var(--fg); box-shadow: 0 2px 8px rgba(0,0,0,.12); white-space: nowrap; z-index: 2; }
.tip .row { display: flex; gap: 8px; align-items: center; }
.tip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--fg2); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; background: var(--panel); color: var(--fg2); border: 0; padding: 5px 12px; cursor: pointer; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.gridwrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); }
table.tok { border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
table.tok td { padding: 2px 3px; white-space: nowrap; }
table.tok td.lab { position: sticky; left: 0; background: var(--panel); color: var(--muted); padding: 2px 10px; border-right: 1px solid var(--rule); font-size: 11px; }
table.tok tr.sep td { border-top: 1px solid var(--rule); padding-top: 6px; }
table.num tr.sep td { border-top: 2px solid var(--rule); }
table.tok tr.phase td.lab { color: var(--fg); }
.t { display: inline-block; padding: 1px 4px; border-radius: 3px; }
.t.f { background: var(--tok-final-bg); color: var(--tok-final-fg); }
.t.m { background: var(--tok-marg-bg); color: var(--tok-marg-fg); }
.t.o { background: var(--tok-other-bg); color: var(--tok-other-fg); }
.key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--fg2); align-items: center; }
table.num { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; width: 100%; }
table.num th, table.num td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--grid); }
table.num th { font-weight: 500; color: var(--muted); font-family: var(--mono); font-size: 12px; }
table.num td:first-child, table.num th:first-child { text-align: left; }
table.num .hi { color: var(--accent); font-weight: 600; }
.tablewrap { overflow-x: auto; }
.pipe { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; }
.pipe .n { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 6px 10px; }
.pipe .n.hl { border-color: var(--accent); color: var(--accent); }
.pipe .a { color: var(--muted); }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
ul.plain li { color: var(--fg2); }
ul.plain li b { color: var(--fg); font-weight: 600; }
.twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
.twocol > * { min-width: 0; }
.scat { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.scat .fig { justify-items: center; }
.scat svg { width: 100%; max-width: 340px; height: auto; display: block; }
.scat .ttl2 { font-size: 13px; color: var(--fg); font-weight: 500; justify-self: start; }
.scat text { font-family: var(--mono); font-size: 9px; fill: var(--muted); }
input[type=range] { width: min(320px, 100%); accent-color: var(--accent); }
.playBtn, #lmPlay { font: inherit; font-size: 13px; background: var(--panel); color: var(--fg2); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.playBtn:focus-visible, #lmPlay:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.stat { font-family: var(--mono); font-size: 13px; color: var(--fg2); }
footer { border-top: 1px solid var(--rule); padding-top: 24px; font-size: 13px; color: var(--muted); display: grid; gap: 8px; }
footer code { color: var(--fg2); }
.langbar { position: fixed; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.08); border-radius: 6px; }
:lang(ko) .eyebrow, :lang(ko) .verdict { letter-spacing: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script id="toydata" type="application/json">__TOY__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const TOY = JSON.parse(document.getElementById('toydata').textContent);
  const TIMERS = new Set();
  function main(lang) {
  const tr = (en, ko) => (lang === 'ko' ? ko : en);
  const every = (fn, ms) => { const id = setInterval(fn, ms); TIMERS.add(id); return id; };
  const NS = 'http://www.w3.org/2000/svg';
  const range = n => Array.from({length: n}, (_, i) => i);

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function fmt(v) { return Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2); }

  // Line chart with a crosshair tooltip. series: {name, x[], y[], color, dash, marker}
  function lineChart(id, o) {
    const host = document.getElementById(id);
    host.innerHTML = '';
    const W = 460, H = o.h || 260, m = {l: 44, r: 12, t: o.title ? 22 : 10, b: 34};
    const svg = el('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': o.title || id}, host);
    const xs = o.series.flatMap(s => s.x), ys = o.series.flatMap(s => s.y);
    const x0 = o.xmin ?? Math.min(...xs), x1 = o.xmax ?? Math.max(...xs);
    const y0 = o.ymin ?? Math.min(0, ...ys), y1 = o.ymax ?? Math.max(...ys) * 1.05;
    const sx = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r);
    const sy = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
    if (o.title) { const t = el('text', {x: m.l, y: 13, class: 'ttl'}, svg); t.textContent = o.title; }
    const yt = o.yticks || range(5).map(i => y0 + (y1 - y0) * i / 4);
    yt.forEach(v => {
      el('line', {x1: m.l, x2: W - m.r, y1: sy(v), y2: sy(v), style: 'stroke:var(--grid);stroke-width:1'}, svg);
      const t = el('text', {x: m.l - 6, y: sy(v) + 3, 'text-anchor': 'end'}, svg); t.textContent = fmt(v);
    });
    const xt = o.xticks || range(6).map(i => x0 + (x1 - x0) * i / 5);
    xt.forEach(v => {
      const t = el('text', {x: sx(v), y: H - m.b + 14, 'text-anchor': 'middle'}, svg); t.textContent = o.xfmt ? o.xfmt(v) : fmt(v);
    });
    el('line', {x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, style: 'stroke:var(--muted);stroke-width:1'}, svg);
    if (o.xlabel) { const t = el('text', {x: (m.l + W - m.r) / 2, y: H - 4, 'text-anchor': 'middle'}, svg); t.textContent = o.xlabel; }
    (o.vlines || []).forEach(v => el('line', {x1: sx(v), x2: sx(v), y1: m.t, y2: H - m.b, style: 'stroke:var(--rule);stroke-width:1;stroke-dasharray:3 3'}, svg));
    o.series.forEach(s => {
      const segs = s.segments || [range(s.x.length)];
      segs.forEach(idx => {
        const d = idx.map((i, k) => (k ? 'L' : 'M') + sx(s.x[i]).toFixed(1) + ' ' + sy(s.y[i]).toFixed(1)).join(' ');
        el('path', {d, style: `fill:none;stroke:${s.color};stroke-width:${s.width || 2};stroke-linejoin:round;stroke-linecap:round;${s.dash ? 'stroke-dasharray:' + s.dash : ''}`}, svg);
      });
      if (s.marker) s.x.forEach((xv, i) => el('circle', {cx: sx(xv), cy: sy(s.y[i]), r: 3.2, style: `fill:${s.color};stroke:var(--panel);stroke-width:1.5`}, svg));
    });
    // hover layer
    const cross = el('line', {y1: m.t, y2: H - m.b, style: 'stroke:var(--muted);stroke-width:1;opacity:0'}, svg);
    const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; host.appendChild(tip);
    const hit = el('rect', {x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, style: 'fill:transparent'}, svg);
    function move(ev) {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) / r.width * W;
      const xv = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
      const rows = [];
      let snap = null;
      o.series.forEach(s => {
        if (s.noTip) return;
        let bi = 0, bd = Infinity;
        s.x.forEach((v, i) => { const dd = Math.abs(v - xv); if (dd < bd) { bd = dd; bi = i; } });
        if (snap === null) snap = s.x[bi];
        rows.push(`<div class="row"><span class="dot" style="background:${s.color}"></span>${s.name}: ${fmt(s.y[bi])}</div>`);
      });
      if (snap === null) return;
      cross.setAttribute('x1', sx(snap)); cross.setAttribute('x2', sx(snap)); cross.style.opacity = 1;
      tip.innerHTML = `<div style="color:var(--muted)">${o.tipx ? o.tipx(snap) : fmt(snap)}</div>` + rows.join('');
      tip.hidden = false;
      const hr = host.getBoundingClientRect();
      let left = ev.clientX - hr.left + 12;
      if (left + tip.offsetWidth > hr.width) left = ev.clientX - hr.left - tip.offsetWidth - 12;
      tip.style.left = Math.max(0, left) + 'px'; tip.style.top = Math.max(0, ev.clientY - hr.top - 10) + 'px';
    }
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerleave', () => { tip.hidden = true; cross.style.opacity = 0; });
  }

  const depth = range(13);
  const dn = depth.map(i => i / 12);
  const tauT = D.rho.teacher.tau;
  const blk = v => tr('block ', '블록 ') + Math.round(v);

  // ---- token grid ----
  function renderGrid(i) {
    const g = D.grids[i], tb = document.getElementById('tokgrid');
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    let h = '';
    g.student.forEach((r, k) => {
      const ph = (k === 0 || k === 2 || k === 7 || k === 10 || k === 12) ? ' phase' : '';
      h += `<tr class="${ph}"><td class="lab">FMLM ${r.label}</td>` + r.tok.map((t, p) => `<td><span class="t ${r.cls[p]}">${esc(t)}</span></td>`).join('') + '</tr>';
    });
    g.teacher.forEach((r, k) => {
      h += `<tr class="${k === 0 ? 'sep' : ''}"><td class="lab">FLM ${r.label}</td>` + r.tok.map((t, p) => `<td><span class="t ${r.cls[p]}">${esc(t)}</span></td>`).join('') + '</tr>';
    });
    tb.innerHTML = h;
  }
  function seg(groupId, attr, fn) {
    const g = document.getElementById(groupId);
    g.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      fn(b.dataset[attr]);
    });
  }
  renderGrid(0);
  seg('sampleSeg', 'i', v => renderGrid(+v));

  // ---- rho ----
  lineChart('c_rho', {title: tr('remaining token disagreement ρ', '남은 토큰 불일치 ρ'), xmin: 0, xmax: 1, ymin: 0, ymax: 1.05, yticks: [0, .25, .5, .75, 1],
    xlabel: tr('normalized progress', '정규화된 진행도'), tipx: v => tr('progress ', '진행도 ') + v.toFixed(2),
    series: [
      {name: 'FMLM', x: dn, y: D.rho.depth.disagree, color: 'var(--s1)', marker: true},
      {name: tr('ridge', '리지'), x: dn, y: D.rho.depth.ridge, color: 'var(--s3)', dash: '5 4'},
      {name: tr('random', '랜덤'), x: dn, y: D.rho.depth.rand, color: 'var(--sg)', dash: '2 3'},
      {name: 'FLM', x: tauT.map((_, k) => k / (tauT.length - 1)), y: D.rho.teacher.disagree, color: 'var(--s2)', noTip: true}]});
  lineChart('c_rhokl', {title: tr('remaining KL ρ', '남은 KL ρ'), xmin: 0, xmax: 1, ymin: 0, ymax: 1.05, yticks: [0, .25, .5, .75, 1],
    xlabel: tr('normalized progress', '정규화된 진행도'), tipx: v => tr('progress ', '진행도 ') + v.toFixed(2),
    series: [
      {name: 'FMLM', x: dn, y: D.rho.depth.kl, color: 'var(--s1)', marker: true},
      {name: 'FLM', x: tauT.map((_, k) => k / (tauT.length - 1)), y: D.rho.teacher.kl, color: 'var(--s2)', noTip: true}]});

  // ---- phases ----
  const P = D.phase;
  lineChart('c_ent', {title: tr('entropy of readout (nats)', 'readout 엔트로피 (nats)'), xmin: 0, xmax: 12, ymin: 0, ymax: 7.4, yticks: [0, 2, 4, 6],
    xticks: [0, 2, 4, 6, 8, 10, 12], xlabel: tr('block', '블록'), tipx: blk,
    series: [
      {name: 'W_out', x: depth, y: P.wo_ent, color: 'var(--s1)', marker: true},
      {name: 'tuned lens', x: depth, y: P.tl_ent, color: 'var(--s3)', dash: '5 4', marker: true},
      {name: tr('marginal', '주변분포'), x: [0, 12], y: [P.marg_ent, P.marg_ent], color: 'var(--sg)', dash: '2 3', width: 1.5},
      {name: tr('teacher final', 'teacher 최종'), x: [0, 12], y: [P.teacher_last_ent, P.teacher_last_ent], color: 'var(--s2)', dash: '2 3', width: 1.5}]});
  lineChart('c_agree', {title: tr('argmax agreement', 'argmax 일치율'), xmin: 0, xmax: 12, ymin: 0, ymax: 1.05, yticks: [0, .25, .5, .75, 1],
    xticks: [0, 2, 4, 6, 8, 10, 12], xlabel: tr('block', '블록'), tipx: blk,
    series: [
      {name: tr('own final (W_out)', '자기 최종 (W_out)'), x: depth, y: P.wo_agree, color: 'var(--s1)', marker: true},
      {name: tr('own final (tuned)', '자기 최종 (tuned)'), x: depth, y: P.tl_agree, color: 'var(--s3)', dash: '5 4'},
      {name: tr('teacher sample', 'teacher 샘플'), x: depth, y: P.agree_teacher, color: 'var(--s2)', marker: true},
      {name: tr('marginal argmax', '주변분포 argmax'), x: depth, y: P.agree_marg, color: 'var(--sg)', dash: '2 3'}]});
  const Q = D.quality.student_layer;
  document.getElementById('t_quality').innerHTML =
    `<tr><th>${tr('block', '블록')}</th>` + Q.map(r => `<th>${r.layer}</th>`).join('') + '</tr>' +
    '<tr><td>Gen. PPL</td>' + Q.map(r => `<td${r.layer === 12 ? ' class="hi"' : ''}>${r.gen_ppl.toFixed(0)}</td>`).join('') + '</tr>' +

    lineChart('c_roll', {title: tr(`${n}-step FMLM: each step decoded across its 12 blocks`, `${n}-step FMLM: 각 step을 12개 블록에 걸쳐 디코딩`), h: 240, xmin: 0, xmax: +n, ymin: 0, ymax: 7.2,
      yticks: [0, 2, 4, 6], xticks: range(+n + 1), vlines: range(+n - 1).map(j => j + 1),
      xfmt: v => 'step ' + v, xlabel: tr('network evaluation + block / 12', '네트워크 평가 + 블록 / 12'),
      tipx: v => { const j = Math.min(+n - 1, Math.floor(v + 1e-6)); const b = Math.round((v - j) * 12); const s = steps[j];
        return `step ${j + 1} (τ ${s.tau_s.toFixed(2)}→${s.tau_t.toFixed(2)}), ${tr('block', '블록')} ${b}`; },
      series: [
        {name: tr('entropy', '엔트로피'), x: xs, y: ent, color: 'var(--s1)', segments: segs},
        {name: '−log δ[final]', x: xs, y: nll, color: 'var(--s2)', dash: '5 4', segments: segs}]});
  }
  renderRoll('4');
  seg('rollSeg', 'n', renderRoll);

  // ---- noise seeding ----
  const S = D.seed;
  const bx = S.betas.map(b => Math.log10(b + 0.01));
  lineChart('c_seed', {title: tr('context-free noise seeding: token agreement', '문맥 없는 noise seeding: 토큰 일치율'), ymin: 0, ymax: 0.45, yticks: [0, .1, .2, .3, .4],
    xmin: Math.min(...bx), xmax: Math.max(...bx), xticks: [0, 0.1, 0.5, 2, 5].map(b => Math.log10(b + 0.01)),
    xfmt: v => 'β ' + (Math.pow(10, v) - 0.01).toFixed(1).replace(/\.0$/, ''), xlabel: tr('noise weight β (log scale)', 'noise 가중치 β (로그 스케일)'),
    tipx: v => 'β = ' + (Math.pow(10, v) - 0.01).toFixed(2),
    series: [
      {name: 'vs FMLM', x: bx, y: S.student, color: 'var(--s1)', marker: true},
      {name: 'vs FLM', x: bx, y: S.teacher, color: 'var(--s2)', marker: true},
      {name: tr('block-0 readout', '블록 0 readout'), x: [bx[0], bx[bx.length - 1]], y: [S.l0, S.l0], color: 'var(--sg)', dash: '2 3', width: 1.5}]});

  // ---- toy ----
  const MODE = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];
  const TS = {ds: 'cities', teacher: 'exact', layer: 0, tau: '0.75'};
  function toyFrame(svg, ds, S, sc) {
    if (ds === 'cities') {
      el('rect', {x: sc(-1), y: sc(-1), width: sc(1) - sc(-1), height: sc(1) - sc(-1), style: 'fill:none;stroke:var(--grid);stroke-width:1'}, svg);
      [[1, 1, 'new york', 1], [-1, -1, 'san diego', 1], [1, -1, 'new diego', 0], [-1, 1, 'san york', 0]].forEach(([x, y, lab, ok]) => {
        const X = sc(x), Y = sc(-y);
        if (ok) el('rect', {x: X - 5, y: Y - 5, width: 10, height: 10, style: 'fill:none;stroke:var(--fg);stroke-width:1.5'}, svg);
        else { el('path', {d: `M${X - 5} ${Y - 5}L${X + 5} ${Y + 5}M${X - 5} ${Y + 5}L${X + 5} ${Y - 5}`, style: 'stroke:var(--muted);stroke-width:1.5'}, svg); }
        const t = el('text', {x: X, y: Y + (y > 0 ? -10 : 18), 'text-anchor': x > 0 ? 'end' : 'start'}, svg); t.textContent = lab;
      });
    } else {
      const pts = range(9).map(k => [Math.cos(2 * Math.PI * k / 8), Math.sin(2 * Math.PI * k / 8)]);
      el('path', {d: pts.map((p, i) => (i ? 'L' : 'M') + sc(p[0]) + ' ' + sc(-p[1])).join(''), style: 'fill:none;stroke:var(--grid);stroke-width:1'}, svg);
      pts.slice(0, 8).forEach((p, k) => { const t = el('text', {x: sc(p[0] * 1.13), y: sc(-p[1] * 1.13) + 3, 'text-anchor': 'middle'}, svg); t.textContent = '(' + k + ',' + k + ')'; });
    }
    el('path', {d: `M${sc(0) - 4} ${sc(0)}h8M${sc(0)} ${sc(0) - 4}v8`, style: 'stroke:var(--muted);stroke-width:1'}, svg);
  }
  function toySvg(id) {
    const host = document.getElementById(id); host.innerHTML = '';
    const S = 300, svg = el('svg', {viewBox: `0 0 ${S} ${S}`, role: 'img'}, host);
    const sc = v => S / 2 + v * S * 0.38;
    return {svg, sc};
  }
  function scatter(id, pts, modes, ds, zoom) {
    const {svg, sc: sc0} = toySvg(id);
    const sc = zoom ? (v => sc0(v / zoom)) : sc0;
    toyFrame(svg, ds, 300, sc);
    pts.forEach((p, n) => el('circle', {cx: sc(p[0]).toFixed(1), cy: sc(-p[1]).toFixed(1), r: 2.2, style: `fill:${MODE[modes[n]]};opacity:.7`}, svg));
  }
  function toyCur() { return (TOY[TS.ds] || {})[TS.teacher] || (TOY[TS.ds] || {}).exact; }
  function renderToyLayer() {
    const T = toyCur(); if (!T) return;
    const i = TS.layer;
    scatter('toyA', T.student[i], T.mode, TS.ds);
    scatter('toyB', T.exact[i], T.mode, TS.ds);
    const W = T.sweep[TS.tau];
    if (W && W.state) {
      const clip = p => [Math.max(-2.6, Math.min(2.6, p[0])), Math.max(-2.6, Math.min(2.6, p[1]))];
      scatter('toyD', W.state[i].map(clip), T.mode, TS.ds, 2);
      const svg = document.querySelector('#toyD svg'), sc = v => 150 + v / 2 * 300 * 0.38;
      W.state_target.forEach(p => { const q = clip(p); el('circle', {cx: sc(q[0]).toFixed(1), cy: sc(-q[1]).toFixed(1), r: 3.2, style: 'fill:none;stroke:var(--muted);stroke-width:.7;opacity:.6'}, svg); });
      document.getElementById('toyTitleD').textContent = tr(`FMLM block ${i} in state space, query 0 → τ_t = ${TS.tau} (t = ${W.t.toFixed(2)})`, `state 공간의 FMLM 블록 ${i}, 쿼리 0 → τ_t = ${TS.tau} (t = ${W.t.toFixed(2)})`);
    }
    if (T.match) {
      const M = T.match, clip = p => [Math.max(-2.6, Math.min(2.6, p[0])), Math.max(-2.6, Math.min(2.6, p[1]))];
      scatter('toyE', M.layer_state[i].map(clip), T.mode, TS.ds, 2);
      scatter('toyF', M.exact_state[i].map(clip), T.mode, TS.ds, 2);
      document.getElementById('toyTitleE').textContent = tr(`Block ${i}: best-matching flow time t = ${M.t[i].toFixed(2)} (measured, not an input)`, `블록 ${i}: 가장 잘 맞는 flow 시간 t = ${M.t[i].toFixed(2)} (입력이 아니라 측정값)`);
      document.getElementById('toyTitleF').textContent = tr(`Multi-step exact flow state at that time (τ = ${M.tau[i].toFixed(2)})`, `그 시간의 multi-step exact flow state (τ = ${M.tau[i].toFixed(2)})`);
    }
    if (T.state) scatter('toyC', T.state[i].map(p => [Math.max(-2.6, Math.min(2.6, p[0])), Math.max(-2.6, Math.min(2.6, p[1]))]), T.mode, TS.ds, 2);
    document.getElementById('toyTitleA').textContent = tr(`FMLM one step, readout after block ${i}`, `FMLM one step, 블록 ${i} 뒤 readout`);
    document.getElementById('toyTitleB').textContent = tr(`Exact posterior E[x₁|x_t] at τ = ${T.exact_tau[i].toFixed(2)}`, `τ = ${T.exact_tau[i].toFixed(2)}의 exact posterior E[x₁|x_t]`);
    document.getElementById('toyTitleC').textContent = tr(`Exact noisy state x_t at τ = ${T.exact_tau[i].toFixed(2)}`, `τ = ${T.exact_tau[i].toFixed(2)}의 exact noisy state x_t`);
    document.querySelectorAll('.toyLayerStat').forEach(e => { e.textContent = tr(`block ${i}: ${(100 * T.valid[i]).toFixed(0)}% valid sentences, ${(100 * T.agree[i]).toFixed(0)}% tokens = final`, `블록 ${i}: 유효 문장 ${(100 * T.valid[i]).toFixed(0)}%, 최종과 같은 토큰 ${(100 * T.agree[i]).toFixed(0)}%`); });
    document.querySelectorAll('.toyLayerSl').forEach(e => { if (+e.value !== i) e.value = i; });
    renderToyPaths();
  }
  function renderToy() {
    const T = toyCur(); if (!T) return;
    const has = !!(TOY[TS.ds] || {})[TS.teacher];
    document.getElementById('tt1').disabled = !(TOY[TS.ds] || {}).flm;
    renderToyLayer();
    const d9 = range(9);
    lineChart('c_toyprog', {title: tr('progress across depth', 'depth에 따른 진행'), xmin: 0, xmax: 8, ymin: 0, ymax: 1.05, yticks: [0, .25, .5, .75, 1],
      xticks: [0, 2, 4, 6, 8], xlabel: tr('block', '블록'), tipx: blk,
      series: [{name: tr('valid', '유효'), x: d9, y: T.valid, color: 'var(--s3)', marker: true},
               {name: tr('= final', '= 최종'), x: d9, y: T.agree, color: 'var(--s1)', marker: true}]});
    document.getElementById('toyProgCap').innerHTML = `<b>${TS.ds}, teacher = ${has ? TS.teacher : 'exact'}.</b> ` + (lang === 'ko'
      ? `One-step 출력이 noise 샘플의 ${(100 * T.endpoint_agree).toFixed(1)}%에서 exact flow의 끝점과 일치합니다. ` +
        (TS.ds === 'cities' ? '유효한 문장이 8개 블록 전체에 걸쳐 점진적으로 늘어납니다.' : '여기서는 네트워크가 블록 2에서 이미 끝납니다. 마지막 블록들이 대부분의 일을 하는 LM1B와 달리, 이 과제는 depth가 필요 없을 만큼 쉽습니다.')
      : `The one-step output matches the exact flow's endpoint for ${(100 * T.endpoint_agree).toFixed(1)}% of noise samples. ` +
        (TS.ds === 'cities' ? 'Valid sentences rise gradually across all 8 blocks.' : 'Here the network is done by block 2: this task is too easy to need its depth, unlike LM1B where the last blocks do most of the work.'));
    const ex = T.rho_exact;
    lineChart('c_toyrho', {title: tr('remaining distance ρ', '남은 거리 ρ'), xmin: 0, xmax: 1, ymin: 0, ymax: 1.05, yticks: [0, .25, .5, .75, 1],
      xlabel: tr('normalized progress', '정규화된 진행도'), tipx: v => tr('progress ', '진행도 ') + v.toFixed(2),
      series: [{name: 'FMLM', x: d9.map(i => i / 8), y: T.rho_depth, color: 'var(--s1)', marker: true},
               {name: 'exact', x: ex.map((_, k) => k / (ex.length - 1)), y: ex, color: 'var(--s2)', noTip: true}]});
    renderToyTau();
    if (T.match) {
      lineChart('c_toymatch', {title: tr('matched diffusion time per block', '블록별로 맞춰진 diffusion 시간'), xmin: 0, xmax: 8, ymin: 0, ymax: 1.05, yticks: [0, .25, .5, .75, 1],
        xticks: [0, 2, 4, 6, 8], xlabel: tr('block', '블록'), tipx: blk,
        series: [{name: tr('matched τ', '맞춰진 τ'), x: d9, y: T.match.tau, color: 'var(--s1)', marker: true},
                 {name: tr('mismatch', '불일치'), x: d9, y: T.match.err, color: 'var(--sg)', dash: '5 4'}]});
      const tz = T.match.tau;
      document.getElementById('toyMatchCap').innerHTML = lang === 'ko'
        ? `<b>${TS.ds}.</b> 블록별로 맞춰진 τ: ${tz.map(v => v.toFixed(2)).join(', ')}. ` +
          (TS.ds === 'cities' ? '블록 0–4가 trajectory를 단조롭게 훑습니다. 블록 5–8은 시간 격자의 끝(τ = 0.99, t ≈ 0.8)에 머물면서 깨끗한 문장까지 남은 간격을 계속 줄입니다(불일치가 계속 감소). 블록 0은 느슨하게만 맞습니다(불일치 최대). 블록 3–4에서 블록 state가 네모의 변을 따라 퍼지는데, exact state는 그렇게 하지 않습니다. 네트워크가 state 공간에서 자기만의 경로를 택합니다.'
                              : 'ring8은 블록 2에서 이미 trajectory 끝에 도달합니다. Depth를 쓰기에는 과제가 너무 쉽습니다.')
        : `<b>${TS.ds}.</b> Matched τ by block: ${tz.map(v => v.toFixed(2)).join(', ')}. ` +
        (TS.ds === 'cities' ? 'Blocks 0–4 sweep the trajectory monotonically; blocks 5–8 sit at the end of the time grid (τ = 0.99, t ≈ 0.8) and keep closing the remaining gap to the clean sentence (mismatch keeps falling). Block 0 matches only loosely (largest mismatch). At blocks 3–4 the block state spreads along the square\'s edges, which the exact state never does: the network takes its own route through state space.'
                            : 'ring8 reaches the end of the trajectory by block 2: the task is too easy to use the depth.');
    }
  }
  function renderToyPaths() {
    const T = toyCur(); if (!T) return;
    const W = T.sweep[TS.tau], L = TS.layer;
    const {svg, sc} = toySvg('toyPaths');
    toyFrame(svg, TS.ds, 300, sc);
    W.target.forEach(g => el('circle', {cx: sc(g[0]), cy: sc(-g[1]), r: 4, style: 'fill:none;stroke:var(--fg);stroke-width:1;opacity:.7'}, svg));
    W.paths.forEach((path, n) => {
      const c = MODE[T.mode[n]], seg = path.slice(0, L + 1);
      if (seg.length > 1) el('path', {d: seg.map((p, i) => (i ? 'L' : 'M') + sc(p[0]).toFixed(1) + ' ' + sc(-p[1]).toFixed(1)).join(''), style: `fill:none;stroke:${c};stroke-width:1;opacity:.35`}, svg);
      const e = path[L];
      el('circle', {cx: sc(e[0]), cy: sc(-e[1]), r: 2.8, style: `fill:${c}`}, svg);
    });
    document.getElementById('toyPathTitle').textContent = tr(`Readout at block ${L} (trail: blocks 0–${L}), query 0 → τ_t = ${TS.tau}`, `블록 ${L}의 readout (궤적: 블록 0–${L}), 쿼리 0 → τ_t = ${TS.tau}`);
  }
  function renderToyTau() {
    const T = toyCur(); if (!T) return;
    const W = T.sweep[TS.tau];
    renderToyPaths();
    const d9 = range(9);
    lineChart('c_toyclean', {title: tr(`query 0 → τ_t = ${TS.tau}`, `쿼리 0 → τ_t = ${TS.tau}`), vlines: [TS.layer], xmin: 0, xmax: 8, ymin: 0, ymax: Math.min(3, Math.max(...W.kl_clean.slice(1), ...W.kl_target.slice(1)) * 1.15),
      xticks: [0, 2, 4, 6, 8], xlabel: tr('block (block 0 off scale)', '블록 (블록 0은 범위 밖)'), tipx: blk,
      series: [{name: tr('KL to clean', 'clean까지 KL'), x: d9.slice(1), y: W.kl_clean.slice(1), color: 'var(--s1)', marker: true},
               {name: tr('KL to target', 'target까지 KL'), x: d9.slice(1), y: W.kl_target.slice(1), color: 'var(--s2)', dash: '5 4', marker: true}]});
    const kc = W.kl_clean, m = kc.indexOf(Math.min(...kc));
    document.getElementById('toyRenoiseCap').innerHTML = lang === 'ko' ? (TS.tau === '1.00'
      ? '<b>깨끗한 끝점을 요청한 경우.</b> 출력이 깨끗한 문장 자체여야 하고, readout은 depth에 따라 그쪽으로 다가갑니다.'
      : `<b>Noisy 끝점 τ_t = ${TS.tau}.</b> Exact target δ*₀,ₜ는 두 문장 사이의 선분 위에 있습니다(속이 빈 원). Readout은 블록 ${m}에서 깨끗한 문장에 가장 가깝고(KL ${kc[m].toFixed(2)}), 블록 8까지 다시 target으로 나갑니다(clean까지 KL ${kc[8].toFixed(2)}). 정답을 아는 상태에서 본 denoise 후 renoise입니다.`) : TS.tau === '1.00'
      ? '<b>Clean endpoint requested.</b> The output should be the clean sentence itself, and the readout approaches it across depth.'
      : `<b>Noisy endpoint τ_t = ${TS.tau}.</b> The exact target δ*₀,ₜ lies on the segment between the two sentences (hollow circles). The readout is closest to the clean sentence at block ${m} (KL ${kc[m].toFixed(2)}), then moves back out to the target by block 8 (KL to clean ${kc[8].toFixed(2)}). That is denoise-then-renoise with a known ground truth.`;
  }
  seg('toyDs', 'v', v => { TS.ds = v; if (!(TOY[v] || {})[TS.teacher]) { TS.teacher = 'exact'; document.querySelectorAll('#toyTeacher button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === 'exact' ? 'true' : 'false')); } renderToy(); });
  seg('toyTeacher', 'v', v => { TS.teacher = v; renderToy(); });
  seg('toyTau', 'v', v => { TS.tau = v; renderToyTau(); renderToyLayer(); });
  function setLayer(i) {
    TS.layer = i;
    renderToyLayer();
    const T = toyCur();
    if (T) { const W = T.sweep[TS.tau]; lineChart('c_toyclean', {title: tr(`query 0 → τ_t = ${TS.tau}`, `쿼리 0 → τ_t = ${TS.tau}`), vlines: [i], xmin: 0, xmax: 8, ymin: 0,
      ymax: Math.min(3, Math.max(...W.kl_clean.slice(1), ...W.kl_target.slice(1)) * 1.15), xticks: [0, 2, 4, 6, 8], xlabel: tr('block (block 0 off scale)', '블록 (블록 0은 범위 밖)'), tipx: blk,
      series: [{name: tr('KL to clean', 'clean까지 KL'), x: range(8).map(k => k + 1), y: W.kl_clean.slice(1), color: 'var(--s1)', marker: true},
               {name: tr('KL to target', 'target까지 KL'), x: range(8).map(k => k + 1), y: W.kl_target.slice(1), color: 'var(--s2)', dash: '5 4', marker: true}]}); }
  }
  document.querySelectorAll('.toyLayerSl').forEach(sl => sl.addEventListener('input', e => { stopPlay(); setLayer(+e.target.value); }));
  let timer = null;
  function stopPlay() { if (timer) { clearInterval(timer); timer = null; } document.querySelectorAll('.playBtn').forEach(b => b.textContent = tr('Play', '재생')); }
  document.querySelectorAll('.playBtn').forEach(btn => btn.addEventListener('click', () => {
    if (timer) { stopPlay(); return; }
    document.querySelectorAll('.playBtn').forEach(b => b.textContent = tr('Pause', '일시정지'));
    if (TS.layer >= 8) setLayer(0);
    timer = every(() => { if (TS.layer >= 8) { stopPlay(); return; } setLayer(TS.layer + 1); }, 700);
  }));
  renderToy();
  }

  function setLang(l) {
    TIMERS.forEach(id => clearInterval(id)); TIMERS.clear();
    const H0 = document.documentElement.scrollHeight || 1, Y0 = window.scrollY || 0;
    document.getElementById('app').innerHTML = document.getElementById('tpl-' + l).innerHTML;
    document.documentElement.lang = l;
    document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === l ? 'true' : 'false'));
    try { localStorage.setItem('dat-lang', l); } catch (e) { /* storage unavailable */ }
    main(l);
    if (Y0 > 0 && window.scrollTo) window.scrollTo(0, Y0 * (document.documentElement.scrollHeight || H0) / H0);
  }
  document.getElementById('langSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b && b.dataset.l) setLang(b.dataset.l);
  });
  let initLang = 'en';
  try { initLang = localStorage.getItem('dat-lang') === 'ko' ? 'ko' : 'en'; } catch (e) { /* storage unavailable */ }
  setLang(initLang);
})();
</script>
